[package]
name = "llama_qwen_server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web框架
axum = "0.7"
tokio = { version = "1.35", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# JSON和配置
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# LLM推理库（支持GGUF）- 使用utilityai/llama-cpp-rs
# Intel Core Ultra 处理器：CPU 后端 + AVX2 指令集优化
# 注意：Vulkan 编译在 Windows 上有路径长度限制问题
# 推荐使用 OpenVINO 来利用 Intel Arc GPU (见 openvino/ 目录)
llama-cpp-2 = { path = "vendor/llama-cpp-rs/llama-cpp-2" }
anyhow = "1.0"
hf-hub = { version = "0.3", features = ["tokio"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 其他工具
chrono = "0.4"
uuid = { version = "1.6", features = ["v4", "serde"] }
once_cell = "1.19"
futures = "0.3"

[profile.release]
opt-level = 3
lto = "fat"          # 更激进的链接时优化
codegen-units = 1
strip = true
panic = "abort"      # 减少panic处理开销
overflow-checks = false  # 禁用溢出检查以提速
