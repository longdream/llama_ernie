[package]
name = "llama_qwen_server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web框架
axum = "0.7"
tokio = { version = "1.35", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# JSON和配置
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# LLM推理库（支持GGUF）- 使用utilityai/llama-cpp-rs
# AMD Radeon 780M: 使用 OpenCL 后端进行 GPU 加速
# Vulkan在AMD集成显卡上存在buffer兼容性问题
# ROCm/HIP在Windows上有MSVC编译器兼容性问题
# OpenCL是Windows上AMD GPU最稳定的GPU加速方案
llama-cpp-2 = { path = "vendor/llama-cpp-rs/llama-cpp-2", features = ["opencl"] }
anyhow = "1.0"
hf-hub = { version = "0.3", features = ["tokio"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 其他工具
chrono = "0.4"
uuid = { version = "1.6", features = ["v4", "serde"] }
once_cell = "1.19"
futures = "0.3"

[profile.release]
opt-level = 3
lto = "fat"          # 更激进的链接时优化
codegen-units = 1
strip = true
panic = "abort"      # 减少panic处理开销
overflow-checks = false  # 禁用溢出检查以提速
