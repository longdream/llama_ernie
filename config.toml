# Qwen3-30B-A3B MoE 模型服务配置文件 - 性能优化版
# Model: Qwen3-30B-A3B-Instruct-2507-Q3_K_S
# 架构: qwen3moe (混合专家模型, 128专家/8激活)
# 参数量: 30.53B, 48层, Q3_K量化 (12.37GB)
# 模型支持最大上下文: 262144 tokens
# 优化目标：提速 + 降低内存消耗
# 注意：代码中已添加 /no_think 指令禁用思考模式

[server]
host = "0.0.0.0"
port = 8766

[model]
# 模型文件路径（相对或绝对路径）
# 使用Q4_K_M量化格式以支持Vulkan GPU加速
path = "D:\\models\\Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf"
# 模型名称（用于API响应）
name = "qwen3-30b"

[inference]
# ===== 推理参数配置 =====

# 最大上下文长度
# Qwen3-30B 支持最大 262144 tokens 上下文
# 实际使用时，系统会根据 prompt 长度 + max_tokens 动态分配，不会浪费内存
# 4096 = 轻量级（适合简单对话）
# 8192 = 标准（适合一般任务）
# 16384 = 大上下文（推荐，支持复杂任务规划）
# 32768 = 超长上下文（需要更多内存）
# 65536+ = 极限上下文（需要大量内存，模型支持最高262144）
n_ctx = 16384

# CPU线程数（关键性能参数）
# 建议设置为物理核心数（非超线程数）
# 例如：8核16线程的CPU设置为8-12（可以略高于物理核心）
# 过多线程会导致上下文切换开销，反而变慢
n_threads = 10

# GPU层数（0=纯CPU，999=全部层放GPU）
# Qwen3-30B-A3B有48层，设置999确保所有层都放到GPU
# Q4_K_M量化格式完全兼容Vulkan GPU加速
n_gpu_layers = 999

# 使用mmap加载模型（重要：减少50%+内存占用）
# true = 模型从磁盘映射，不完全加载到RAM
# false = 模型完全加载到RAM（快但占内存）
use_mmap = true

# 批处理大小（已在代码中固定为512，此参数保留作为参考）
# 注意：实际使用的是代码中硬编码的值
# n_batch = 512（大批次）
# n_ubatch = 256（微批次，实际影响速度的参数）
n_batch = 512

[embedding]
# Embedding模型文件路径
model_path = "D:\\models\\bge-m3-Q4_K_M.gguf"
# Embedding模型名称
model_name = "bge-m3"
# Embedding端口（与LLM分开）
port = 8767
# Embedding维度
dimension = 1024
# Embedding专用优化（小模型，快速响应）
# 提升n_ctx以支持更长文本（BGE-M3支持8192）
n_ctx = 8192
n_threads = 4
n_batch = 512

[logging]
# 日志级别: trace, debug, info, warn, error
level = "info"
