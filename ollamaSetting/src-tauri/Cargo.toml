[package]
name = "OllamaSetting"
version = "0.1.0"
description = "Ollama GPU Configuration Tool for Intel Arc"
authors = ["devcloud"]
edition = "2021"

[lib]
name = "ollama_setting_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "OllamaSetting"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
winreg = "0.52"
regex = "1"
